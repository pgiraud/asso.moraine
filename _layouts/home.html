<!DOCTYPE html>
<html>
  {% include head.html %}

  <body class="home">
  {% include navbar.html %}

  {{ content }}

  {% include footer.html %}

  {% include scripts.html %}
  <body>

  <!-- Scroll effect -->
  <script>
    window.addEventListener("scroll", () => {
      if (window.scrollY > 20) {
        document.body.classList.add("scrolled");
      } else {
        document.body.classList.remove("scrolled");
      }
    });
  </script>

</html>
